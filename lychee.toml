###
### Display
###
# Verbose program output
verbose = "debug"


###
### Runtime
###
# Number of threads to utilize.
# Defaults to number of cores available to the system if omitted.
#threads = 2


###
### Requests
###
# User agent to send with each request
user_agent = "curl/7.71.1"

# Website timeout from connect to response finished
timeout = 20

# Maximum number of allowed redirects -- set to 0 because redirect itself typically means "found"!
max_redirects = 0

# Maximum number of retries per request -- default is 3 but this can cause random errors to occur during the check.
# Retries back off between attempts, so a high value makes every timeout or 5xx very slow.
max_retries = 5

# Comma-separated list of accepted status codes for valid links.
# Omit to accept all response types.
accept = ["200..=299", "301", "302"]    # 301 Moved Permanently, 302 Found

# Proceed for server connections considered insecure (invalid TLS)
insecure = false

# Only test links with the given scheme (e.g. https)
# Omit to check links with any scheme
#scheme = "https"

# Request method
method = "get"

# Rate-limit sensitive hosts
max_concurrency = 10
host_request_interval = "500ms"


###
### Exclusions
###
# Exclude URLs from checking (supports regex)
# GNU (all of gnu.org) is included here because it very frequently hits rate limits or times out, even with very conservative internal/retry values and lychee's cache enabled
#
# The second group are hosts whose pages exist but which reject automated
# requests from CI runners (bot protection, typically 403). Lychee >= 0.24
# supports per-host headers via a `[hosts."<host>"]` table, which may allow
# re-enabling some of these in future.
#
# The third group are not links: credentialed git remotes in the push workflows.
#
# The fourth group are index pages that Doxygen generates at build time; the
# devdoc markdown links to them, but they do not exist in the source tree.
exclude = [
    ".*highlightjs.*",
    ".*conda/.*",
    ".git/.*",
    "^https?://(www\\.)?gnu\\.org/",

    "^https://www\\.flaticon\\.com/",
    "^https://(www\\.)?merriam-webster\\.com/",
    "^https?://(www\\.)?ams\\.org/",
    "^https://www\\.openmp\\.org/",
    "^https://en\\.cppreference\\.com/",
    "^https://(stackoverflow\\.com|math\\.stackexchange\\.com)/",
    "^https://github\\.com/signup",
    "^https://pure\\.mpg\\.de/",
    "^https://www\\.jneurosci\\.org/",
    "^https?://www\\.scholarpedia\\.org/",
    "^https://inkscape\\.org/",

    "^https://ghpusher",

    "^file://.*/doc/developer_space/(annotated|namespaces|files)\\.html$",
]

# Rewrite URLs before checking (regex, `$n` refers to capture groups).
# github.com throttles file views ("blob" pages) from CI runners with 503s.
# raw.githubusercontent.com serves the same file and still 404s if the file
# or branch is gone, so check that instead.
remap = [
    "^https://github\\.com/([^/]+)/([^/]+)/blob/(.+)$ https://raw.githubusercontent.com/$1/$2/$3",
]

# Exclude input paths from checking (supports glob).
# The Sphinx/Jinja2 HTML templates contain unrendered `{{ pathto(...) }}`
# expressions that are only resolved at doc build time. Checking the raw
# template source reports these as broken local files, so skip it.
# This file is skipped too: lychee would read the regexes above as URLs.
# So is the restored request cache (`url,status,timestamp` lines), which the
# workflow's `find` picks up as a text file.
exclude_path = ["doc/htmldoc/templates", "lychee\\.toml$", "\\.lycheecache$"]

# Exclude URLs contained in a file from checking
# If a file named `.lycheeignore` exists in the current working directory,
# its contents will be excluded as well.
#exclude_file = []

# Exclude all private IPs from checking
# Equivalent to setting `exclude_private`, `exclude_link_local`, and `exclude_loopback` to true
exclude_all_private = true

# Exclude private IP address ranges from checking
exclude_private = true

# Exclude link-local IP address range from checking
exclude_link_local = true

# Exclude loopback IP address range and localhost from checking
exclude_loopback = true

# Exclude all mail addresses from checking
include_mail = false
