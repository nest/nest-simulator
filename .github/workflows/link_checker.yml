name: "Link Checker"

on:
  push:
    branches: [separate_linkcheck]  # TEMPORARY: remove before merging---don't forget!
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link_checker:
    runs-on: "ubuntu-24.04"
    # if: ${{ github.repository_owner == 'nest' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: "Checkout repository content"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Lychee Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lychee-cache-${{ runner.os }}-

      - name: Link Checker File Check
        run: |
          find . -path "./.git" -prune -o -path "./thirdparty" -prune -o -type f -exec sh -c 'file -b --mime-type "$0" | grep -q "^text/"' {} \; -print > lychee_files_list.txt    # find all ASCII type files
          grep -q "\.md$" lychee_files_list.txt   # check that there is at least one markdown, etc. file in the list
          grep -q "\.rst$" lychee_files_list.txt
          grep -q "\.cpp$" lychee_files_list.txt
          grep -q "\.h$" lychee_files_list.txt
          echo "The following files will be link-checked by lychee:"
          cat lychee_files_list.txt

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --cache --max-cache-age 1d --cache-exclude-status '400..=599' --files-from lychee_files_list.txt
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
