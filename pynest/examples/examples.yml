# Registry of all PyNEST examples in pynest/examples/.
#
# This file is the single source of truth for PyNEST example metadata: which
# files make up an example, which NEST models it demonstrates, and whether it is
# exercised by automation.
#
# Read today by:
#   - check_examples_registry.py : validates this registry against the files on disk
#
# Planned consumers (not yet implemented):
#   - the downstream nest-simulator-examples workflows, to run examples and to
#     convert them into Jupyter notebooks for EBRAINS
#   - the Sphinx listexamples directive, to link model doc pages to examples
#
# Anything derivable from the repository itself is deliberately absent.  In
# particular there is no field recording what changed since the last release:
# git already knows, and a hand-maintained copy of it only goes stale.
#
# -- Required fields ----------------------------------------------------------
#
# name: str
#   Unique identifier for the example.  Usually the entry-point file stem, but
#   not always: several spatial/ files have generic stems that would collide,
#   and a multi-file example is named for its directory rather than its main
#   script.
#
# path: str
#   The entry-point script, relative to pynest/examples/.  For a multi-file
#   example this is the main script (e.g. run_simulation.py); its supporting
#   modules go in helper_scripts.
#
# models: list[str]
#   The NEST models the example demonstrates.  List the kernel model names only,
#   never an example-local CopyModel alias.  Required unless the entry is
#   skipped entirely (skip: all).
#
# -- Optional fields ----------------------------------------------------------
#
# skip: all | notebook
#   Omit this field for a normal example: it is run in CI and converted to a
#   notebook.  Set it when that is not possible:
#     all       - neither run nor converted (missing optional library, special
#                 MPI setup, or similar)
#     notebook  - run in CI, but not converted (a benchmark, say, which is not
#                 meaningful as a notebook)
#   An entry with skip must explain itself in notes.
#
# notes: str
#   Anything a reader needs to know.  Required whenever skip is set; also used
#   on ordinary entries to record a caveat.
#
# helper_scripts: list[str]
#   Supporting .py files the example imports, relative to pynest/examples/.
#   Listing them here is what stops check_examples_registry.py from reporting
#   them as unregistered examples in their own right.
#
# data_files: list[str]
#   Data files or directories the example needs, relative to pynest/examples/.
#
# post_script: str
#   A script to run after the main example, relative to pynest/examples/.
#

